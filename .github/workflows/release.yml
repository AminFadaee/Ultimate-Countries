name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build decks
        run: |
          uv run geography deck
          uv run geography places-deck

      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" build/ultimate_countries.apkg build/ultimate_places.apkg \
            --title "Ultimate Countries and Ultimate Places ${GITHUB_REF_NAME#v}" \
            --notes "Anki decks built from the data in this commit: ultimate_countries.apkg and ultimate_places.apkg. Importing a newer version keeps your progress." \
            --verify-tag
