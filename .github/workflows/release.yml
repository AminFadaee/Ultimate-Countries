name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build decks
        run: |
          uv run geography deck
          uv run geography places-deck
          for directory in data/country_decks/*/; do uv run geography country-deck "$(basename "$directory")"; done

      - name: Publish release
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || echo "Anki decks built from the data in this commit." > "$notes"
          gh release create "$GITHUB_REF_NAME" build/*.apkg \
            --title "Ultimate Geography decks ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            --verify-tag
